name: Build Apollo Kernel with Latest KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'G960N (Galaxy S9 Kor)'
        type: choice
        options:
          - 'G960N (Galaxy S9 Kor)'
          - 'G960F (Galaxy S9 Intl)'
          - 'ALL (All S9 / S9+ / Note9)'
      kernel_version_suffix:
        description: 'Kernel Version Suffix (replaces -ksu to hide from detection)'
        required: true
        default: '-rel'
        type: string

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd git gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python-dev-is-python3 bsdiff bc libssl-dev ccache

      - name: Setup KernelSU-Next v3.4.0 (Legacy)
        run: |
          echo "Setting up KernelSU-Next legacy v3.4.0..."
          rm -rf KernelSU drivers/kernelsu
          git clone --depth 1 --branch legacy-susfs-v2 https://github.com/sidex15/KernelSU-Next.git KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu

          echo "Fixing Linux 4.9 compatibility & init.rc hook in KernelSU-Next..."
          python3 -c "
          import os
          # 1. Alias strscpy_pad to __strscpy_pad across KernelSU source files
          for root, dirs, files in os.walk('KernelSU/kernel'):
              for f in files:
                  if f.endswith(('.c', '.h')) and f != 'kernel_compat.h':
                      p = os.path.join(root, f)
                      with open(p, 'r') as fp:
                          content = fp.read()
                      if 'strscpy_pad' in content:
                          content = content.replace('strscpy_pad', '__strscpy_pad')
                          with open(p, 'w') as fp:
                              fp.write(content)
                          print(f'Patched strscpy_pad in {f}')

          # 2. Add macro polyfill in kernel_compat.h for kernels < 4.14
          with open('KernelSU/kernel/compat/kernel_compat.h', 'r') as f:
              c = f.read()
          target = '#endif\n}\n\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)'
          patch = '#endif\n}\n\n#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 14, 222)\n#define strscpy_pad __strscpy_pad\n#endif\n\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)'
          if target in c:
              c = c.replace(target, patch)
              with open('KernelSU/kernel/compat/kernel_compat.h', 'w') as f:
                  f.write(c)
              print('Patched kernel_compat.h')

          # 3. Allow pagefault in strncpy_from_user_nofault during execve
          with open('KernelSU/kernel/compat/kernel_compat.c', 'r') as f:
              cc = f.read()
          old_pf = '\tset_fs(USER_DS);\n\tpagefault_disable();\n\tret = strncpy_from_user(dst, unsafe_addr, count);\n\tpagefault_enable();\n\tset_fs(old_fs);'
          new_pf = '\tset_fs(USER_DS);\n\tret = strncpy_from_user(dst, unsafe_addr, count);\n\tset_fs(old_fs);'
          if old_pf in cc:
              cc = cc.replace(old_pf, new_pf)
              with open('KernelSU/kernel/compat/kernel_compat.c', 'w') as f:
                  f.write(cc)
              print('Patched strncpy_from_user_nofault in kernel_compat.c')

          # 4. Fix init.rc path matching for GSI / LineageOS / system-as-root
          with open('KernelSU/kernel/runtime/ksud_integration.c', 'r') as f:
              kc = f.read()
          old_init = '''    if (!!strcmp(dpath, \"/init.rc\") && !!strcmp(dpath, \"/system/etc/init/hw/init.rc\")) {
        return false;
    }

    return true;'''
          new_init = '''    if (!strstr(dpath, \"init.rc\")) {
        return false;
    }

    pr_info(\"vfs_read: matched init.rc at %s\\\\n\", dpath);
    return true;'''
          if old_init in kc:
              kc = kc.replace(old_init, new_init)
              with open('KernelSU/kernel/runtime/ksud_integration.c', 'w') as f:
                  f.write(kc)
              print('Patched ksud_integration.c init.rc matching')
          "

          echo "KernelSU-Next legacy setup complete:"
          git -C KernelSU log -1 --oneline

      - name: Apply Anti-Detection & Suffix Settings
        run: |
          SUFFIX="${{ github.event.inputs.kernel_version_suffix }}"
          echo "Setting kernel version suffix to: $SUFFIX"
          sed -i "s/CR_IMAGE_NAME=\$CR_IMAGE_NAME-ksu/CR_IMAGE_NAME=\$CR_IMAGE_NAME$SUFFIX/g" apollo.sh
          sed -i "s/zver=\$zver-KernelSU/zver=\$zver$SUFFIX/g" apollo.sh

      - name: Setup Toolchain (Clang 18)
        run: |
          mkdir -p toolchain/clang-r522817
          echo "Downloading Google Clang r522817..."
          curl -sL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz | tar -xz -C toolchain/clang-r522817
          touch buildtools

      - name: Compile Apollo Kernel
        run: |
          find . -name "*.sh" -exec sed -i 's/\r$//' {} +
          chmod +x apollo.sh Apollo/A.I.K/*.sh || true
          CHOICE="${{ github.event.inputs.target }}"
          TARGET_NUM=4 # default G960N
          MKZIP=n
          if [[ "$CHOICE" == *"G960N"* ]]; then
            TARGET_NUM=4
            MKZIP=n
          elif [[ "$CHOICE" == *"G960F"* ]]; then
            TARGET_NUM=1
            MKZIP=n
          elif [[ "$CHOICE" == *"ALL"* ]]; then
            TARGET_NUM=8
            MKZIP=y
          fi

          echo "Compiling with Target $TARGET_NUM (Clang 18, Enforcing, KSU v3.4.0)..."
          export KSU_VERSION_OVERRIDE=33294
          export KSU_VERSION_TAG_OVERRIDE="v3.4.0-legacy"

          if [ "$TARGET_NUM" = "8" ]; then
            printf "%s\n3\n2\ny\nn\nn\ny\n" "$TARGET_NUM" | bash apollo.sh
          else
            printf "%s\n3\n2\ny\nn\nn\n" "$TARGET_NUM" | bash apollo.sh
          fi

          if ! ls Apollo/Product/*.img 1> /dev/null 2>&1 && ! ls Apollo/Out/*.img 1> /dev/null 2>&1; then
            echo "ERROR: Kernel compilation failed! No .img file produced!"
            exit 1
          fi

      - name: Package Artifacts
        run: |
          mkdir -p out_artifacts
          if [ -d Apollo/Product ]; then
            cp -v Apollo/Product/*.img out_artifacts/ || true
          fi
          if [ -d Apollo/Out ]; then
            cp -v Apollo/Out/*.img out_artifacts/ || true
            cp -v Apollo/Out/*.zip out_artifacts/ || true
          fi
          echo "Artifacts list:"
          ls -lh out_artifacts/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-KernelSU-Next-v3.4.0-Build
          path: out_artifacts/*
