name: Build Apollo Kernel with Latest KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'G960N (Galaxy S9 Kor)'
        type: choice
        options:
          - 'G960N (Galaxy S9 Kor)'
          - 'G960F (Galaxy S9 Intl)'
          - 'ALL (All S9 / S9+ / Note9)'
      kernel_version_suffix:
        description: 'Kernel Version Suffix (replaces -ksu to hide from detection)'
        required: true
        default: '-rel'
        type: string

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd git gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python-dev-is-python3 bsdiff bc libssl-dev ccache

      - name: Setup KernelSU-Next v3.4.0 (Legacy)
        run: |
          echo "Setting up KernelSU-Next legacy v3.4.0..."
          rm -rf KernelSU drivers/kernelsu
          git clone --depth 1 --branch legacy-susfs-v2 https://github.com/sidex15/KernelSU-Next.git KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu

          # Provide compatibility stubs for legacy manual hook references in security/security.c
          cat << 'EOF' > KernelSU/kernel/compat_stubs.c
#include <linux/types.h>
#include <linux/dcache.h>
#include <linux/cred.h>

int ksu_handle_prctl(int option, unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5) {
    return 0;
}

int ksu_handle_rename(struct dentry *old_dentry, struct dentry *new_dentry) {
    return 0;
}

int ksu_handle_setuid(struct cred *new, const struct cred *old) {
    return 0;
}
EOF
          echo "kernelsu-objs += compat_stubs.o" >> KernelSU/kernel/Kbuild

          # Hook ksu_handle_sys_reboot into kernel/reboot.c so userspace manager can establish [ksu_driver] fd
          python3 -c "
with open('kernel/reboot.c', 'r') as f:
    c = f.read()

if 'ksu_handle_sys_reboot' not in c:
    hook_decl = '''
#ifdef CONFIG_KSU
extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
#endif
'''
    c = hook_decl + c
    target = 'if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))'
    hook_call = '''#ifdef CONFIG_KSU
	if (magic1 == 0xDEADBEEF && magic2 == 0xCAFEBABE) {
		ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
		return 0;
	}
#endif
	''' + target
    c = c.replace(target, hook_call, 1)
    with open('kernel/reboot.c', 'w') as f:
        f.write(c)
    print('kernel/reboot.c patched successfully for ksu_handle_sys_reboot')
else:
    print('kernel/reboot.c already contains hook')
"

      - name: Apply Anti-Detection & Suffix Settings
        run: |
          SUFFIX="${{ github.event.inputs.kernel_version_suffix }}"
          echo "Setting kernel version suffix to: $SUFFIX"
          sed -i "s/CR_IMAGE_NAME=\$CR_IMAGE_NAME-ksu/CR_IMAGE_NAME=\$CR_IMAGE_NAME$SUFFIX/g" apollo.sh
          sed -i "s/zver=\$zver-KernelSU/zver=\$zver$SUFFIX/g" apollo.sh

      - name: Setup Toolchain (Clang 18)
        run: |
          mkdir -p toolchain/clang-r522817
          echo "Downloading Google Clang r522817..."
          curl -sL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz | tar -xz -C toolchain/clang-r522817
          touch buildtools

      - name: Compile Apollo Kernel
        run: |
          CHOICE="${{ github.event.inputs.target }}"
          TARGET_NUM=4 # default G960N
          MKZIP=n
          if [[ "$CHOICE" == *"G960N"* ]]; then
            TARGET_NUM=4
            MKZIP=n
          elif [[ "$CHOICE" == *"G960F"* ]]; then
            TARGET_NUM=1
            MKZIP=n
          elif [[ "$CHOICE" == *"ALL"* ]]; then
            TARGET_NUM=8
            MKZIP=y
          fi

          echo "Compiling with Target $TARGET_NUM (Clang 18, Enforcing, KSU v3.4.0)..."
          export KSU_VERSION_OVERRIDE=33294
          export KSU_VERSION_TAG_OVERRIDE="v3.4.0-legacy"

          # Input sequence to apollo.sh prompts:
          # 1: Target (1-8)
          # 2: Compiler (3=clang18)
          # 3: Selinux (2=enforcing)
          # 4: KSU (y)
          # 5: SuSFS (n)
          # 6: Clean (n)
          # 7: Zip (y if target==8)
          if [ "$TARGET_NUM" = "8" ]; then
            printf "%s\n3\n2\ny\nn\nn\ny\n" "$TARGET_NUM" | bash apollo.sh
          else
            printf "%s\n3\n2\ny\nn\nn\n" "$TARGET_NUM" | bash apollo.sh
          fi

      - name: Package Artifacts
        run: |
          mkdir -p out_artifacts
          if [ -d Apollo/Product ]; then
            cp -v Apollo/Product/*.img out_artifacts/ || true
          fi
          if [ -d Apollo/Out ]; then
            cp -v Apollo/Out/*.img out_artifacts/ || true
            cp -v Apollo/Out/*.zip out_artifacts/ || true
          fi
          echo "Artifacts list:"
          ls -lh out_artifacts/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-KernelSU-Next-v3.4.0-Build
          path: out_artifacts/*
